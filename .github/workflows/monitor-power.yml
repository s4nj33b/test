name: Monitor Power

on:
  push:
    branches: ['**']
    paths: ['MonitorPower/**', '.github/workflows/monitor-power.yml']
  pull_request:
    paths: ['MonitorPower/**', '.github/workflows/monitor-power.yml']
  # Creating a release on GitHub (any tag name, e.g. 0.01 or v0.02) builds the
  # DMG and attaches it to that release.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to build and attach the DMG to (e.g. 0.01). Created if missing. Leave empty to only build.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14   # Apple Silicon runner, matching the app's target hardware
    defaults:
      run:
        working-directory: MonitorPower
    env:
      # Optional. When MACOS_CERT_P12 is set, builds are Developer ID-signed and
      # notarized; otherwise they are ad-hoc signed. See README "Notarization".
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            echo "TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
            echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.02-dev.${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Import Developer ID certificate
        if: env.MACOS_CERT_P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          test -n "$IDENTITY" || { echo "No Developer ID Application identity in MACOS_CERT_P12" >&2; exit 1; }
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build app and DMG
        run: make dmg VERSION="$VERSION" SIGN_IDENTITY="${SIGN_IDENTITY:--}"

      - name: Notarize DMG
        if: env.SIGN_IDENTITY != ''
        run: make notarize VERSION="$VERSION" SIGN_IDENTITY="$SIGN_IDENTITY"

      - name: Test DMG fallback path
        run: |
          MAKE_DMG_FALLBACK=1 ./scripts/make-dmg.sh build/MonitorPower.app build/fallback-test.dmg "Monitor Power Test"
          hdiutil verify build/fallback-test.dmg
          MOUNT=$(mktemp -d)
          hdiutil attach build/fallback-test.dmg -nobrowse -mountpoint "$MOUNT"
          test -d "$MOUNT/MonitorPower.app" && test -L "$MOUNT/Applications"
          codesign --verify --deep --strict "$MOUNT/MonitorPower.app"
          hdiutil detach "$MOUNT"
          rm build/fallback-test.dmg

      - name: Verify bundle
        run: |
          codesign --verify --deep --strict build/MonitorPower.app
          test -x build/MonitorPower.app/Contents/Resources/smc-power
          test -f build/MonitorPower.app/Contents/Resources/helper-install.sh
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" build/MonitorPower.app/Contents/Info.plist
          build/smc-power status || true   # the runner is a VM; SMC keys may be absent

      - uses: actions/upload-artifact@v4
        with:
          name: MonitorPower-${{ env.VERSION }}
          path: MonitorPower/build/MonitorPower-*.dmg

      - name: Publish GitHub release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Release already exists (created on GitHub): attach or replace the DMG.
            gh release upload "$TAG" build/MonitorPower-*.dmg --clobber
          else
            # Creates the tag at this commit if it does not exist yet.
            gh release create "$TAG" build/MonitorPower-*.dmg \
              --target "$GITHUB_SHA" \
              --title "Monitor Power $VERSION" \
              --notes-file RELEASE_NOTES.md \
              --prerelease
          fi
